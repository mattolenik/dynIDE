<!doctype html><html><head><meta charset="utf-8"><title>scene</title><style>:root{--bg:#1e1e2e;--fg:#cdd6f4;--accent:#89b4fa;--muted:#7f849c;--focus:#f9e2af;--warning:#fab387;--error:#f38ba8;--success:#a6e3a1;--info:#74c7ec;--surface:#313244;--selected:#45475a;--strong:#ffffff;--inverse:#1e1e2e}body{margin:1em;background:var(--bg);color:var(--fg);font:14px/1.5 monospace}.scene{position:relative;overflow:hidden;background:var(--bg)}.scene>*,[data-rect]{position:absolute;box-sizing:border-box}.pane{background:#666;color:#eee;overflow:hidden;white-space:pre}.pane.focused{outline:2px solid var(--focus)}[data-role]{display:flex;flex-wrap:wrap;gap:0 1ch;align-items:center}[data-role=list],[data-role=section],[data-role=sidebar],[data-role=modal],[data-role=menu],[data-role=item],[data-role=toast]{flex-direction:column;align-items:stretch}[data-role=modal],[data-role=menu],[data-role=toast],[data-role=sidebar],[data-role=status]{background:var(--surface)}[data-role=modal].danger{outline:2px solid var(--error)}ul{list-style:none;margin:0;padding:0}.active{background:var(--selected)}.dot{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:var(--muted)}.state-working .dot{background:var(--warning)}.state-blocked .dot{background:var(--error)}.state-idle .dot,.state-done .dot{background:var(--success)}.tok-accent{color:var(--accent)}.tok-muted{color:var(--muted)}.tok-focus{color:var(--focus)}.tok-warning{color:var(--warning)}.tok-error{color:var(--error)}.tok-info{color:var(--info)}.tok-success{color:var(--success)}.tok-strong{color:var(--strong);font-weight:bold}.tok-inverse{color:var(--inverse);background:var(--fg)}.tok-selected{background:var(--selected)}.tok-surface{background:var(--surface)}</style></head><body><div class="scene" style="width:120ch;height:60.0em"><div class="pane focused" data-pane="1" style="left:26ch;top:1.5em;width:94ch;height:57.0em"><b>pane 1</b>
</div><div data-role="root" data-id=":root" class="tok-default"><div data-role="sidebar" data-id=":sidebar" class="tok-default" data-rect style="left:0ch;top:0.0em;width:26ch;height:58.5em"><div data-role="section" data-id=":spaces" class="tok-default">spaces<ul data-role="list" data-id=":list" class="tok-default"><li data-role="item" data-id="{:workspace, 1}" class="tok-default active"><div data-role="group" data-id="{:line, 0}" class="tok-default"><span data-role="badge" data-id=":state" class="tok-default state-unknown"><span class="dot" title=":unknown"></span></span><span data-role="text" data-id=":workspace" class="tok-default">1</span></div></li></ul><button data-role="button" data-id=":new" class="tok-default" type="button">new</button><button data-role="button" data-id=":menu" class="tok-default" type="button">menu</button></div><div data-role="divider" data-id=":split" class="tok-default" data-rect style="left:0ch;top:30.0em;width:25ch;height:1.5em"></div><div data-role="section" data-id=":agents" class="tok-default">agents<ul data-role="list" data-id=":list" class="tok-default"><li data-role="item" data-id="{:pane, 1}" class="tok-default active"><div data-role="group" data-id="{:line, 0}" class="tok-default"><span data-role="badge" data-id=":state" class="tok-default state-unknown"><span class="dot" title=":unknown"></span></span><span data-role="text" data-id=":workspace" class="tok-default">1</span></div><div data-role="group" data-id="{:line, 1}" class="tok-default"><span data-role="text" data-id=":agent" class="tok-default">terminal</span></div></li></ul></div><button data-role="button" data-id=":toggle" class="tok-default" type="button"></button><div data-role="divider" data-id=":edge" class="tok-default" data-rect style="left:25ch;top:0.0em;width:1ch;height:58.5em"></div></div><div data-role="tabs" data-id=":tabs" class="tok-default" data-rect style="left:26ch;top:0.0em;width:94ch;height:1.5em"><div data-role="tab" data-id="{:tab, 1}" class="tok-default active">1</div><button data-role="button" data-id=":new_tab" class="tok-default" type="button"></button></div><div data-role="status" data-id=":status" class="tok-default" data-rect style="left:0ch;top:58.5em;width:120ch;height:1.5em"><span data-role="text" data-id=":mode" class="tok-default">TERMINAL</span><span data-role="text" data-id=":title" class="tok-muted"></span><span data-role="text" data-id=":hint" class="tok-muted">ctrl+b</span></div><div data-role="modal" data-id="{:modal, 1}" class="tok-default" data-rect style="left:22ch;top:13.5em;width:76ch;height:33.0em"><span data-role="text" data-id=":title" class="tok-strong">settings</span><div data-role="tabs" data-id=":sections" class="tok-default"><div data-role="tab" data-id="{:section, :theme}" class="tok-default">theme</div><div data-role="tab" data-id="{:section, :indicators}" class="tok-default active">indicators</div><div data-role="tab" data-id="{:section, :sound}" class="tok-default">sound</div><div data-role="tab" data-id="{:section, :toasts}" class="tok-default">toasts</div></div><span data-role="spacer" data-id=":gap" class="tok-default"></span><span data-role="text" data-id=":heading" class="tok-strong">agent status indicators</span><span data-role="text" data-id=":description" class="tok-muted">choose color dots or distinct symbols for each state</span><span data-role="spacer" data-id=":gap2" class="tok-default"></span><ul data-role="list" data-id=":list" class="tok-default"><li data-role="item" data-id="{:choice, 0}" class="tok-default">color dots</li><li data-role="item" data-id="{:choice, 1}" class="tok-default">distinct symbols</li></ul><span data-role="text" data-id=":hint" class="tok-muted">↑↓ select  tab section</span><div data-role="group" data-id=":actions" class="tok-default"><button data-role="button" data-id=":apply" class="tok-default" type="button">apply</button><button data-role="button" data-id=":close" class="tok-default" type="button">close</button></div></div></div></div></body></html>
