# herdr-live default config. Save as ~/.config/herdr-live/config.toml (or $HERDR_LIVE_CONFIG).
# Values shown are the defaults; the [keys] entries are commented, uncomment to change one.

# Uncomment to skip the first-run onboarding.
# onboarding = false

[ui]
sidebar_width = 26
sidebar_min_width = 18
sidebar_max_width = 36
# sidebar_start_collapsed = false
confirm_close = true
status_indicators = "dots"   # "dots" | "symbols"
prompt_new_tab_name = true
# hide_tab_bar_when_single_tab = false
# tab_bar_position = "top"   # "top" | "bottom"

[ui.sound]
enabled = true
# command = "afplay"         # run with the sound name as its last argument

[ui.toast]
delivery = "herdr"           # "off" | "herdr" | "terminal" | "system"
delay_seconds = 1            # 0..3600

[theme]
name = "catppuccin"
auto_switch = false
light_name = "catppuccin-latte"
dark_name = "catppuccin"

[worktrees]
# directory = "~/.herdr-live/worktrees"   # new checkouts go to <directory>/<repo>/<branch>

# Custom commands go after [keys], one [[keys.command]] table each. type is "shell" (the
# default, runs in the background), "pane" (runs in a new split) or "plugin_action"; the
# command sees HERDR_ACTIVE_WORKSPACE_ID, HERDR_ACTIVE_TAB_ID, HERDR_ACTIVE_PANE_ID and
# HERDR_ACTIVE_PANE_CWD. For example:
#   [[keys.command]]
#   key = "prefix+g"
#   command = "lazygit"
#   type = "pane"
#   description = "lazygit"

# Each value is a key string or an array of them; [] unbinds. "prefix+x" means x after the prefix.
[keys]
