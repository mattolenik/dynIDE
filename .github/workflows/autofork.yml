# Fork-only: keep this fork as upstream herdrdev/herdr master plus our patch series.
# See https://github.com/mattolenik/gha-autofork and FORK.md.
name: autofork

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Prepare and verify without updating refs or issues
        type: boolean
        default: true
      initial_base:
        description: First run only; inspected merge-base SHA of the fork and upstream
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  sync:
    # Pinned to the gha-autofork commit tagged v1; bump deliberately after reviewing the diff.
    uses: mattolenik/gha-autofork/.github/workflows/autofork.yml@1604e3f0f42cb636ca0d9a5bd81b927220fc1564
    with:
      upstream: herdrdev/herdr
      upstream_branch: master
      branch: master
      # Worker and reviewer default to Claude Code against the DeepSeek API (deepseek:deepseek-v4-pro).
      verify_command: bash scripts/autofork_verify.sh
      # Herdr's suite needs a real host (root-owned sticky /tmp, PTY handoff, ACL
      # xattrs), so verification runs unsandboxed with the read-only token.
      verify_sandbox: false
      initial_base: ${{ inputs.initial_base || '' }}
      publish: auto
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      token: ${{ secrets.AUTOFORK_TOKEN }}
      deepseek_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
